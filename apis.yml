aid: taurus
name: Taurus
description: >-
  Taurus SA (Taurus HQ) is a Geneva-based digital asset infrastructure provider for
  banks and financial institutions. Its platform spans four institutional products
  exposed through APIs: Taurus-PROTECT (bank-grade custody of cryptocurrencies, digital
  assets, and private keys secured in FIPS 140-2 Level 3 HSMs), Taurus-CAPITAL (issuance
  and lifecycle management of tokenized securities and digital assets), Taurus-EXPLORER
  (blockchain node and indexing services across dozens of protocols), and Taurus-PRIME
  (institutional trading connectivity with deep liquidity via REST and FIX). The
  Taurus-PROTECT REST API (versioned /api/rest/v1/) uses bearer plus HMAC request signing,
  cursor-based pagination, and governance rules enforced by digital signatures, with
  first-party Java, Go, Python, and TypeScript SDKs, OIDC/SAML SSO, and SCIM provisioning.
