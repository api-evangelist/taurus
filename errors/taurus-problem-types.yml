problems:
  - code: E900-INVALID_CURSOR_DATA
    title: Invalid cursor data
    meaning: >-
      The pagination cursor token was malformed or manually constructed rather than copied
      verbatim from a prior response.
    remediation: >-
      Pass the exact cursor.currentPage token returned by the previous response; do not build
      the token by hand.
